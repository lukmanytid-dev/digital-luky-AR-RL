<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vision Web AR - Stable</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-blur: 25px;
        }

        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; user-select: none;
            /* Orientasi default diusahakan landscape */
            orientation: landscape; 
        }

        /* Video Background */
        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; transition: transform 0.3s ease;
        }
        .mirror { transform: scaleX(-1); }

        /* Kursor Tangan (Telunjuk) */
        #cursor {
            position: absolute; width: 24px; height: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%); z-index: 9999;
            pointer-events: none; display: none; transition: width 0.1s, height 0.1s, background-color 0.1s;
        }
        .cursor-active { 
            width: 15px !important; height: 15px !important; 
            background-color: #007AFF !important; box-shadow: 0 0 20px #007AFF !important; 
        }

        /* Kontrol Kamera & Layar */
        #top-controls {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            display: flex; gap: 15px;
        }
        .btn-control {
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); color: white; padding: 12px 20px;
            border-radius: 30px; font-size: 16px; font-weight: 500; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.2s;
        }
        .btn-control:hover, .btn-control.touched { background: rgba(255,255,255,0.4); transform: scale(1.05); }

        /* Layar Utama 3D (Home Screen) */
        #home-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 50px; z-index: 10;
            perspective: 1000px; /* Efek 3D */
        }

        .app-icon-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        
        .app-icon {
            width: 100px; height: 100px; border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; cursor: pointer;
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 2px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.2);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .app-icon.touched { 
            transform: scale(0.9) translateY(5px); 
            background: rgba(255,255,255,0.5); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .app-label { color: white; font-weight: 600; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-size: 18px; letter-spacing: 1px;}

        /* Jendela Aplikasi Melayang */
        .app-window {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 80vh; max-width: 1200px; max-height: 800px;
            background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.4);
            display: none; flex-direction: column; overflow: hidden; z-index: 50;
        }

        .window-header {
            width: 100%; height: 60px; display: flex; align-items: center; justify-content: center;
            position: relative; background: rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .drag-bar {
            width: 120px; height: 6px; background: rgba(255,255,255,0.4);
            border-radius: 3px; cursor: grab; transition: 0.2s;
        }
        .window-header.dragging .drag-bar { background: #007AFF; transform: scaleY(1.5); }

        .close-btn {
            position: absolute; left: 20px; width: 30px; height: 30px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-weight: bold; font-size: 14px;
            transition: 0.2s;
        }
        .close-btn:hover, .close-btn.touched { background: #ff453a; transform: scale(1.1); }

        /* Iframe yang solid */
        iframe { 
            width: 100%; flex: 1; border: none; background: #000; 
            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
        }
        
        /* Overlay Loading */
        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999; font-size: 24px; font-weight: bold;
        }

        /* Landscape hint untuk HP */
        @media screen and (orientation: portrait) {
            #loading::after {
                content: "Putar HP Anda ke mode Landscape (Miring) untuk pengalaman terbaik.";
                display: block; margin-top: 20px; font-size: 16px; color: #007AFF; text-align: center; max-width: 80%;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>Memuat Vision AR...</div>
        <div style="font-size: 16px; margin-top: 10px; color: #ccc; font-weight: normal;">Pastikan izin kamera diberikan</div>
    </div>

    <video id="videoElement" class="mirror" autoplay playsinline></video>

    <div id="cursor"></div>

    <div id="top-controls">
        <div class="btn-control interactive" id="btn-camera" onclick="toggleCamera()">📸 Ganti Kamera</div>
        <div class="btn-control interactive" id="btn-fullscreen" onclick="toggleFullscreen()">🖥️ Layar Penuh</div>
    </div>

    <div id="home-screen">
        <div class="app-icon-container">
            <div class="app-icon interactive" id="icon-youtube" style="color: #ff0000;">▶</div>
            <span class="app-label">YouTube</span>
        </div>
        <div class="app-icon-container">
            <div class="app-icon interactive" id="icon-chrome" style="color: #4285F4;">🌐</div>
            <span class="app-label">Browser</span>
        </div>
    </div>

    <div id="app-window" class="app-window">
        <div class="window-header interactive" id="window-header">
            <div class="close-btn interactive" id="btn-close" onclick="closeApp()">✖</div>
            <div class="drag-bar"></div>
        </div>
        <iframe id="app-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const cursor = document.getElementById('cursor');
        const homeScreen = document.getElementById('home-screen');
        const appWindow = document.getElementById('app-window');
        const appFrame = document.getElementById('app-frame');
        const windowHeader = document.getElementById('window-header');
        
        let isFrontCamera = true;
        let stream = null;
        
        // State Interaksi
        let lastTouchTime = 0;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // ================= SISTEM KAMERA MANUAL (Anti-Flicker) =================
        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: isFrontCamera ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoElement.srcObject = stream;
                
                if (isFrontCamera) videoElement.classList.add('mirror');
                else videoElement.classList.remove('mirror');
                
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }
        }

        function toggleCamera() {
            isFrontCamera = !isFrontCamera;
            startCamera(); // Langsung timpa tanpa me-restart MediaPipe Loop!
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // ================= MANAJEMEN APLIKASI =================
        function openApp(appId) {
            homeScreen.style.display = 'none';
            appWindow.style.display = 'flex';
            appWindow.style.left = '50%';
            appWindow.style.top = '50%';
            
            if(appId === 'icon-youtube') {
                // Parameter tambahan pada link YouTube agar jalan stabil di iframe
                appFrame.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0";
            } else if (appId === 'icon-chrome') {
                appFrame.src = "https://id.wikipedia.org/"; 
            }
        }

        function closeApp() {
            appWindow.style.display = 'none';
            appFrame.src = ""; // Stop video/audio
            homeScreen.style.display = 'flex';
        }

        // ================= SETUP MEDIAPIPE =================
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1, modelComplexity: 1,
            minDetectionConfidence: 0.7, minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Ambil titik telunjuk (8) dan jempol (4)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                let screenX = indexTip.x * window.innerWidth;
                if (isFrontCamera) screenX = (1 - indexTip.x) * window.innerWidth; // Sesuaikan Mirror
                let screenY = indexTip.y * window.innerHeight;

                cursor.style.display = 'block';
                cursor.style.left = `${screenX}px`;
                cursor.style.top = `${screenY}px`;

                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const isTouching = pinchDist < 0.05;

                if (isTouching) {
                    cursor.classList.add('cursor-active');
                    handleDirectTouch(screenX, screenY);
                } else {
                    cursor.classList.remove('cursor-active');
                    
                    if(isDragging) {
                        isDragging = false;
                        windowHeader.classList.remove('dragging');
                    }
                    document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
                }
            } else {
                cursor.style.display = 'none';
                isDragging = false;
            }
        });

        // Loop Manual yang Lebih Stabil dari camera_utils.js
        let lastVideoTime = -1;
        async function detectionLoop() {
            if (videoElement.readyState >= 2 && !videoElement.paused) {
                // Sembunyikan loading jika video sudah jalan
                document.getElementById('loading').style.display = 'none';
                
                if (videoElement.currentTime !== lastVideoTime) {
                    lastVideoTime = videoElement.currentTime;
                    try {
                        await hands.send({ image: videoElement });
                    } catch(e) {
                        console.error("Frame skip", e);
                    }
                }
            }
            requestAnimationFrame(detectionLoop);
        }

        // Inisialisasi Pertama
        startCamera().then(() => {
            detectionLoop();
        });


        // ================= LOGIKA SENTUHAN LANGSUNG (DIRECT TOUCH) =================
        function handleDirectTouch(x, y) {
            cursor.style.display = 'none'; // Hindari menghalangi klik
            const element = document.elementFromPoint(x, y);
            cursor.style.display = 'block';

            if (!element) return;

            // 1. Drag & Drop Jendela
            if (element.closest('#window-header') && appWindow.style.display === 'flex') {
                if (!isDragging) {
                    isDragging = true;
                    windowHeader.classList.add('dragging');
                    const rect = appWindow.getBoundingClientRect();
                    dragOffsetX = x - (rect.left + rect.width / 2);
                    dragOffsetY = y - (rect.top + rect.height / 2);
                }
                
                appWindow.style.left = `${x - dragOffsetX}px`;
                appWindow.style.top = `${y - dragOffsetY}px`;
                return; 
            }

            // 2. Sentuh Tombol / Ikon
            const now = Date.now();
            if (now - lastTouchTime < 1000) return; // Cooldown 1 detik

            const target = element.closest('.interactive');
            if (target) {
                target.classList.add('touched');
                lastTouchTime = now;

                const targetId = target.id;
                setTimeout(() => {
                    if (targetId === 'icon-youtube' || targetId === 'icon-chrome') openApp(targetId);
                    else if (targetId === 'btn-close') closeApp();
                    else if (targetId === 'btn-camera') toggleCamera();
                    else if (targetId === 'btn-fullscreen') toggleFullscreen();
                }, 150); // Animasi
            }
        }
    </script>
</body>
</html>
