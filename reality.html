<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vision XR - Spatial Web</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --glass-bg: rgba(10, 25, 47, 0.4);
            --glass-border: rgba(0, 255, 255, 0.4);
            --glass-blur: 20px;
            --neon-glow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; user-select: none;
            perspective: 1200px; /* Untuk efek 3D Ruangan */
        }

        /* Video Background */
        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1;
        }
        .mirror { transform: scaleX(-1); }

        /* Canvas untuk Tangan Sensor Digital */
        canvas#ar-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 999; pointer-events: none; /* Tangan di-render di atas UI */
        }

        /* AR World Container (Menampung UI agar bisa diam saat kamera gerak) */
        #ar-world {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 100vh;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) translateZ(-300px);
            z-index: 10; display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s ease-out;
        }

        /* Container UI (Bisa diperbesar/diperkecil) */
        #ui-container {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s;
            transform: scale(1); /* Skala awal */
        }

        /* Kursor Tangan */
        #cursor {
            position: absolute; width: 24px; height: 24px;
            border: 2px solid #0ff; border-radius: 50%; box-shadow: var(--neon-glow);
            transform: translate(-50%, -50%); z-index: 10000;
            pointer-events: none; display: none; transition: 0.1s;
        }
        .cursor-active { 
            background-color: #0ff; transform: translate(-50%, -50%) scale(0.6) !important;
        }

        /* Top Controls */
        #top-controls {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            display: flex; gap: 15px;
        }
        .btn-control {
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); color: #0ff; padding: 10px 18px;
            border-radius: 30px; font-size: 14px; cursor: pointer;
            box-shadow: var(--neon-glow); text-transform: uppercase; letter-spacing: 1px;
        }

        /* Jendela Aplikasi */
        .app-window {
            width: 60vw; height: 65vh; max-width: 900px;
            background: rgba(5, 10, 20, 0.6); backdrop-filter: blur(var(--glass-blur));
            border: 2px solid var(--glass-border); border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.2), 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden;
            transform: translateZ(50px); /* Melayang sedikit ke depan */
        }

        .window-header {
            width: 100%; height: 50px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(90deg, rgba(0,255,255,0.1), rgba(0,255,255,0)); 
            border-bottom: 1px solid var(--glass-border);
        }
        .window-title { color: #0ff; font-weight: bold; letter-spacing: 2px; }

        iframe { width: 100%; flex: 1; border: none; background: #fff; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #0ff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }
    </style>
</head>
<body>

    <div id="loading">Memuat Vision XR Core...<br><small>Izinkan Kamera & Sensor Gerak</small></div>

    <video id="videoElement" class="mirror" autoplay playsinline></video>
    
    <!-- AR World: Ini yang akan diam saat HP digerakkan (Parallax Gyroscope) -->
    <div id="ar-world">
        <div id="ui-container">
            <div id="app-window" class="app-window">
                <div class="window-header">
                    <span class="window-title">ANDROID XR // SYSTEM</span>
                </div>
                <!-- Contoh memuat model 3D atau Web -->
                <iframe id="app-frame" src="https://en.wikipedia.org/wiki/Augmented_reality"></iframe>
            </div>
        </div>
    </div>

    <!-- Canvas Tangan Sensor ditaruh di paling depan (z-index tinggi) -->
    <canvas id="ar-canvas"></canvas>
    <div id="cursor"></div>
    <div id="top-controls">
        <div class="btn-control" onclick="enableSensor()">Aktifkan Sensor Gerak</div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('ar-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('cursor');
        const arWorld = document.getElementById('ar-world');
        const uiContainer = document.getElementById('ui-container');

        let isFrontCamera = true;
        let uiScale = 1;
        let initialZoomDist = 0;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoElement.srcObject = stream;
                videoElement.classList.remove('mirror');
                isFrontCamera = false;
            } catch (err) { alert("Gagal akses kamera belakang."); }
        }

        // --- SISTEM SENSOR GYROSCOPE (Agar UI diam di tempat) ---
        let baseAlpha = null, baseBeta = null;
        function handleOrientation(event) {
            if (!baseAlpha) { baseAlpha = event.alpha; baseBeta = event.beta; }
            let xOffset = event.alpha - baseAlpha;
            let yOffset = event.beta - baseBeta;
            // Memutar container berlawanan dengan arah gerak HP
            arWorld.style.transform = `translate(-50%, -50%) rotateY(${xOffset}deg) rotateX(${-yOffset}deg) translateZ(-300px)`;
        }
        
        function enableSensor() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            document.querySelector('.btn-control').style.display = 'none';
        }

        // --- SISTEM MEDIAPIPE (2 TANGAN UNTUK ZOOM & TANGAN DIGITAL) ---
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ 
            maxNumHands: 2, // DETEKSI 2 TANGAN
            modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 
        });

        const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16], [13,17],[0,17],[17,18],[18,19],[19,20]];

        hands.onResults((results) => {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Gambar Tangan "Sensor Digital"
                results.multiHandLandmarks.forEach(landmarks => {
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = "rgba(0, 255, 255, 0.8)";
                    canvasCtx.shadowBlur = 10;
                    canvasCtx.shadowColor = "cyan";

                    HAND_CONNECTIONS.forEach(pair => {
                        const p1 = { x: landmarks[pair[0]].x * window.innerWidth, y: landmarks[pair[0]].y * window.innerHeight };
                        const p2 = { x: landmarks[pair[1]].x * window.innerWidth, y: landmarks[pair[1]].y * window.innerHeight };
                        canvasCtx.beginPath(); canvasCtx.moveTo(p1.x, p1.y); canvasCtx.lineTo(p2.x, p2.y); canvasCtx.stroke();
                    });

                    // Titik Sendi (Nodes)
                    landmarks.forEach(lm => {
                        canvasCtx.fillStyle = "rgba(255, 255, 255, 0.9)";
                        canvasCtx.beginPath();
                        canvasCtx.arc(lm.x * window.innerWidth, lm.y * window.innerHeight, 3, 0, 2*Math.PI);
                        canvasCtx.fill();
                    });
                });

                // Kursor dari Tangan Pertama
                const lm1 = results.multiHandLandmarks[0];
                const indexX = lm1[8].x * window.innerWidth;
                const indexY = lm1[8].y * window.innerHeight;
                cursor.style.display = 'block';
                cursor.style.left = `${indexX}px`; cursor.style.top = `${indexY}px`;

                // --- GESTUR ZOOM (Perbesar/Perkecil dengan 2 Tangan) ---
                if (results.multiHandLandmarks.length === 2) {
                    const lm2 = results.multiHandLandmarks[1];
                    const index2X = lm2[8].x * window.innerWidth;
                    const index2Y = lm2[8].y * window.innerHeight;

                    // Hitung jarak antara dua telunjuk
                    const dist = Math.hypot(index2X - indexX, index2Y - indexY);

                    if (!initialZoomDist) { initialZoomDist = dist; } 
                    else {
                        // Ubah skala UI berdasarkan tarikan tangan
                        let scaleFactor = dist / initialZoomDist;
                        let newScale = uiScale * scaleFactor;
                        
                        // Batas minimal dan maksimal zoom
                        if(newScale > 0.5 && newScale < 2.5) {
                            uiContainer.style.transform = `scale(${newScale})`;
                        }
                        
                        // Reset jika tangan menjauh terlalu cepat untuk update state
                        if(Math.abs(dist - initialZoomDist) > 50) {
                            uiScale = newScale;
                            initialZoomDist = dist;
                        }
                    }
                } else {
                    initialZoomDist = 0; // Reset jika tangan kurang dari 2
                }

            } else {
                cursor.style.display = 'none';
                initialZoomDist = 0;
            }
        });

        let lastVideoTime = -1;
        async function detectionLoop() {
            if (videoElement.readyState >= 2 && !videoElement.paused) {
                document.getElementById('loading').style.display = 'none';
                if (videoElement.currentTime !== lastVideoTime) {
                    lastVideoTime = videoElement.currentTime;
                    try { await hands.send({ image: videoElement }); } catch(e) {}
                }
            }
            requestAnimationFrame(detectionLoop);
        }

        startCamera().then(() => detectionLoop());
    </script>
</body>
</html>
