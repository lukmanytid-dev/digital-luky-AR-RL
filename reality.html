<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Spatial Reality Computing</title>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top:0; left:0; width:100vw; height:100vh; z-index: 2; pointer-events: none; }

        /* Window Aplikasi */
        .app-window {
            position: absolute; top: 100px; left: 100px; width: 400px; height: 300px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 15px;
            display: flex; flex-direction: column; z-index: 5;
        }
        .header { height: 30px; background: rgba(0,0,0,0.5); cursor: move; padding: 5px; display:flex; justify-content:space-between; align-items:center; }
        iframe { flex: 1; border: none; background: white; }
        
        #cursor { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: cyan; z-index: 100; pointer-events: none; border: 2px solid white; transition: 0.05s; }
        .pinching { background: red !important; transform: scale(0.6); }

        #controls { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; gap: 10px; }
        button { padding: 10px; cursor: pointer; border-radius: 8px; border:none; background: #333; color: white; }
    </style>
</head>
<body>

<div id="controls">
    <button onclick="toggleCam()">Ganti Kamera</button>
    <button onclick="toggleFS()">Full Screen</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="cursor"></div>

<!-- Youtube Window -->
<div id="yt-win" class="app-window" style="left:50px;">
    <div class="header"><span>YouTube</span><span onclick="this.parentElement.parentElement.style.display='none'">✖</span></div>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</div>

<!-- Chrome Window -->
<div id="ch-win" class="app-window" style="left:500px;">
    <div class="header"><span>Browser</span><span onclick="this.parentElement.parentElement.style.display='none'">✖</span></div>
    <iframe src="https://id.wikipedia.org/"></iframe>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');
    let useFront = true;
    let isDragging = false;
    let activeWindow = null;

    // --- SETUP MEDIA PIPE ---
    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
    const face = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });

    hands.setOptions({ maxNumHands: 1 });
    
    // Callback utama deteksi
    function onResults(results) {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        
        // 1. Gambar Pose & Wajah
        if (results.poseLandmarks) drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#00FF00'});
        if (results.multiFaceLandmarks) for(const l of results.multiFaceLandmarks) drawConnectors(ctx, l, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1});

        // 2. Logika Tangan & Interaksi
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const h = results.multiHandLandmarks[0];
            const tip = h[8];
            const thumb = h[4];
            
            const x = (1 - tip.x) * window.innerWidth;
            const y = tip.y * window.innerHeight;
            
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';
            cursor.style.display = 'block';

            const dist = Math.hypot(tip.x - thumb.x, tip.y - thumb.y);
            if (dist < 0.05) {
                cursor.classList.add('pinching');
                handleInteraction(x, y);
            } else {
                cursor.classList.remove('pinching');
                isDragging = false;
            }
        }
    }

    // Menggunakan camera_utils untuk menjalankan deteksi
    const camera = new Camera(video, {
        onFrame: async () => {
            await hands.send({image: video});
            await pose.send({image: video});
            await face.send({image: video});
        },
        width: 1280, height: 720
    });
    
    // Gabung hasil
    hands.onResults(onResults);
    pose.onResults(onResults);
    face.onResults(onResults);
    camera.start();

    // --- FUNGSI INTERAKSI ---
    function handleInteraction(x, y) {
        const el = document.elementFromPoint(x, y);
        
        // Jika pinch di header aplikasi, maka drag
        if (el && el.classList.contains('header')) {
            isDragging = true;
            activeWindow = el.parentElement;
        }
        
        if (isDragging && activeWindow) {
            activeWindow.style.left = (x - 200) + 'px';
            activeWindow.style.top = (y - 15) + 'px';
        }
    }

    // --- UTILS ---
    function toggleCam() {
        useFront = !useFront;
        camera.stop();
        camera.video.srcObject = null;
        camera.start(); // Sederhana, bisa disempurnakan dengan constraint facingMode
    }

    function toggleFS() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
</script>
</body>
</html>
