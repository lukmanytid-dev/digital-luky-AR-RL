<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vision Web AR - 3D Spatial & Scroll</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-blur: 25px;
        }

        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; user-select: none;
            /* Membantu 3D Gyroscope */
            perspective: 1000px;
        }

        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1;
        }
        canvas#ar-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }
        .mirror { transform: scaleX(-1); }

        #cursor {
            position: absolute; width: 15px; height: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%); z-index: 9999;
            pointer-events: none; display: none; transition: 0.1s;
        }
        .cursor-active { 
            background-color: #00FF00 !important; box-shadow: 0 0 20px #00FF00 !important; 
            transform: translate(-50%, -50%) scale(0.7) !important;
        }

        /* Container 3D Induk (Untuk Gyroscope) */
        #ar-world {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            transform-style: preserve-3d; z-index: 50; pointer-events: none;
        }

        #top-controls { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 15px; pointer-events: auto;}
        .btn-control {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); color: white; padding: 10px 18px;
            border-radius: 30px; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .btn-control:hover, .btn-control.touched { background: rgba(255,255,255,0.4); transform: scale(1.05); }

        /* Jendela Aplikasi Melayang (DIBUAT MIRIP FOTO 3D) */
        .app-window {
            position: absolute; top: 50%; left: 50%; 
            width: 45vw; height: 65vh; min-width: 600px;
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 2px solid var(--glass-border); border-radius: 20px;
            box-shadow: -20px 20px 50px rgba(0,0,0,0.7), inset 0 0 15px rgba(255,255,255,0.1);
            display: none; flex-direction: column; overflow: hidden;
            pointer-events: auto;
            
            /* EFEK 3D PERSPEKTIF MIRIP DI FOTO */
            transform: translate(-50%, -50%) rotateY(-20deg) rotateX(5deg);
            transform-origin: center center;
            transition: left 0.1s, top 0.1s;
        }

        .window-header {
            width: 100%; height: 50px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .drag-bar-container { flex: 1; display: flex; justify-content: center; height: 100%; align-items: center; cursor: grab; }
        .drag-bar { width: 100px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 3px; pointer-events: none;}
        .window-header.dragging .drag-bar { background: #00FF00; }

        .close-btn {
            width: 28px; height: 28px; background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-weight: bold;
        }
        .close-btn:hover, .close-btn.touched { background: #ff453a; }

        /* SCROLL WRAPPER HACK */
        .scroll-wrapper {
            width: 100%; flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
            /* Sembunyikan scrollbar bawaan */
            scrollbar-width: none; 
        }
        .scroll-wrapper::-webkit-scrollbar { display: none; }
        
        /* Iframe dibuat SANGAT TINGGI agar bisa di-scroll dari luar */
        iframe { width: 100%; height: 2500px; border: none; pointer-events: none; background: #fff;}

        /* Menu Utama */
        #home-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 40px; pointer-events: auto;
        }
        .app-icon-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .app-icon {
            width: 80px; height: 80px; border-radius: 20px; display: flex; justify-content: center; align-items: center;
            font-size: 40px; cursor: pointer; background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
        }
        .app-icon.touched { transform: scale(0.9); background: rgba(255,255,255,0.5); }
        .app-label { color: white; font-weight: bold; font-size: 15px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }
    </style>
</head>
<body>

    <div id="loading" class="interactive" onclick="initExperience()">
        <h2 style="margin:0;">KLIK UNTUK MULAI AR</h2>
        <p style="color: #ccc; font-size: 14px;">Izinkan Kamera & Sensor Gerak</p>
    </div>

    <video id="videoElement" class="mirror" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>

    <div id="cursor"></div>

    <!-- Dunia 3D untuk sensor Giroskop -->
    <div id="ar-world">
        <!-- Menu Utama -->
        <div id="home-screen">
            <div class="app-icon-container">
                <div class="app-icon interactive" id="icon-youtube" style="color: #ff0000;">▶</div>
                <span class="app-label">YouTube</span>
            </div>
        </div>

        <!-- Jendela 3D -->
        <div id="app-window" class="app-window window-draggable">
            <div class="window-header">
                <div class="close-btn interactive" id="btn-close">✖</div>
                <div class="drag-bar-container interactive drag-handle">
                    <div class="drag-bar"></div>
                </div>
                <div style="width: 28px;"></div>
            </div>
            <!-- Wrapper untuk Gestur Scroll -->
            <div class="scroll-wrapper interactive" id="scroll-area">
                <iframe id="app-frame" src=""></iframe>
            </div>
        </div>
    </div>

    <div id="top-controls">
        <div class="btn-control interactive" id="btn-camera" onclick="toggleCamera()">📸 Balik Kamera</div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('ar-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('cursor');
        
        const arWorld = document.getElementById('ar-world');
        const homeScreen = document.getElementById('home-screen');
        const appWindow = document.getElementById('app-window');
        const appFrame = document.getElementById('app-frame');
        const scrollArea = document.getElementById('scroll-area');
        
        let isFrontCamera = true;
        let stream = null;
        
        // State Gestur
        let wasTouching = false; 
        let activeAction = null; // 'drag' atau 'scroll'
        let dragOffsetX = 0; let dragOffsetY = 0;
        let scrollStartY = 0; let initialScrollTop = 0;

        // Giroskop (Pseudo-World Tracking)
        let baseAlpha = null; 
        let baseBeta = null;

        function resizeCanvas() { canvasElement.width = window.innerWidth; canvasElement.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        async function initExperience() {
            document.getElementById('loading').style.display = 'none';
            await startCamera();
            startGyroscope();
            startMediaPipe();
        }

        async function startCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: isFrontCamera ? "user" : "environment", width: { ideal: 1280 } }});
                videoElement.srcObject = stream;
                if (isFrontCamera) videoElement.classList.add('mirror');
                else videoElement.classList.remove('mirror');
            } catch (err) { alert("Gagal kamera: " + err.message); }
        }

        function toggleCamera() { isFrontCamera = !isFrontCamera; startCamera(); }

        // ================= GIROSKOP (AGAR TETAP DI TEMPAT) =================
        function startGyroscope() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(r => { if(r === 'granted') addGyroListener(); });
            } else { addGyroListener(); }
        }

        function addGyroListener() {
            window.addEventListener('deviceorientation', (event) => {
                if(!baseAlpha) baseAlpha = event.alpha;
                if(!baseBeta) baseBeta = event.beta;

                // Hitung pergerakan HP
                let diffX = event.alpha - baseAlpha;
                let diffY = event.beta - baseBeta;

                // Pindahkan ar-world berlawanan arah dengan HP (EFEK MELAYANG DI RUANGAN)
                arWorld.style.transform = `translate3d(${diffX * 5}px, ${diffY * 5}px, 0px)`;
            });
        }

        function openApp() {
            homeScreen.style.display = 'none';
            appWindow.style.display = 'flex';
            // PENTING: Gunakan Yewtu.be karena iframe youtube asli diblokir total
            appFrame.src = "https://yewtu.be/"; 
            appWindow.style.left = '50%'; appWindow.style.top = '50%';
        }
        function closeApp() {
            appWindow.style.display = 'none'; appFrame.src = ""; homeScreen.style.display = 'flex';
        }

        // ================= MEDIAPIPE GESTURE =================
        function startMediaPipe() {
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const getScreenPos = (lm) => {
                        let x = lm.x * window.innerWidth;
                        if (isFrontCamera) x = (1 - lm.x) * window.innerWidth;
                        return { x: x, y: lm.y * window.innerHeight };
                    };

                    const indexTip = getScreenPos(landmarks[8]);
                    const thumbTip = getScreenPos(landmarks[4]);
                    const indexBase = getScreenPos(landmarks[5]);
                    
                    const pointerX = indexTip.x + (indexTip.x - indexBase.x) * 0.3;
                    const pointerY = indexTip.y + (indexTip.y - indexBase.y) * 0.3;

                    // Gambar garis laser
                    canvasCtx.lineWidth = 4; canvasCtx.strokeStyle = "#00FF00";
                    canvasCtx.beginPath(); canvasCtx.moveTo(indexTip.x, indexTip.y); canvasCtx.lineTo(pointerX, pointerY); canvasCtx.stroke();

                    cursor.style.display = 'block'; cursor.style.left = `${pointerX}px`; cursor.style.top = `${pointerY}px`;

                    const isTouching = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y) < 50;

                    if (isTouching) {
                        cursor.classList.add('cursor-active');
                        if (!wasTouching) processPinchStart(pointerX, pointerY);
                        else processPinchMove(pointerX, pointerY);
                        wasTouching = true;
                    } else {
                        cursor.classList.remove('cursor-active');
                        if (wasTouching) processPinchEnd(pointerX, pointerY);
                        wasTouching = false;
                    }
                } else { cursor.style.display = 'none'; wasTouching = false; activeAction = null; }
            });

            let lastVideoTime = -1;
            async function detectionLoop() {
                if (videoElement.readyState >= 2 && !videoElement.paused) {
                    if (videoElement.currentTime !== lastVideoTime) {
                        lastVideoTime = videoElement.currentTime;
                        try { await hands.send({ image: videoElement }); } catch(e) {}
                    }
                }
                requestAnimationFrame(detectionLoop);
            }
            detectionLoop();
        }

        // ================= LOGIKA KLIK, DRAG, & SCROLL =================
        function processPinchStart(x, y) {
            cursor.style.display = 'none'; 
            const element = document.elementFromPoint(x, y);
            cursor.style.display = 'block';
            
            if (!element) return;

            // 1. Apakah mencubit Header untuk Pindah Jendela?
            if (element.closest('.drag-handle')) {
                activeAction = 'drag';
                element.closest('.window-header').classList.add('dragging');
                const rect = appWindow.getBoundingClientRect();
                dragOffsetX = x - rect.left;
                dragOffsetY = y - rect.top;
                return;
            }

            // 2. Apakah mencubit Badan Iframe untuk SCROLL?
            if (element.closest('#scroll-area')) {
                activeAction = 'scroll';
                scrollStartY = y; // Catat posisi Y awal tangan
                initialScrollTop = scrollArea.scrollTop; // Catat posisi scroll awal halaman
                return;
            }

            // 3. Efek Klik Tombol UI
            if(element.classList.contains('interactive')) element.classList.add('touched'); 
        }

        function processPinchMove(x, y) {
            if (activeAction === 'drag') {
                // Geser Jendela
                appWindow.style.left = `${x - dragOffsetX}px`;
                appWindow.style.top = `${y - dragOffsetY}px`;
            } 
            else if (activeAction === 'scroll') {
                // SCROLL HALAMAN YOUTUBE
                const deltaY = scrollStartY - y; 
                // Kalikan kecepatan scroll agar responsif
                scrollArea.scrollTop = initialScrollTop + (deltaY * 3); 
            }
        }

        function processPinchEnd(x, y) {
            activeAction = null;
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));

            cursor.style.display = 'none'; 
            const element = document.elementFromPoint(x, y);
            cursor.style.display = 'block';

            if (element) {
                const target = element.closest('.interactive');
                if (target) {
                    const id = target.id;
                    if (id === 'icon-youtube') openApp();
                    else if (id === 'btn-close') closeApp();
                    else if (id === 'btn-camera') toggleCamera();
                }
            }
        }
    </script>
</body>
</html>
