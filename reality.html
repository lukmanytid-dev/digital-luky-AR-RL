<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Spatial Computing V2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            user-select: none;
        }

        /* Video Kamera */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        /* Class ini akan dipasang/dilepas tergantung kamera depan/belakang */
        .mirror {
            transform: scaleX(-1);
        }

        /* Canvas untuk Tulang Tangan & Laser */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .canvas-mirror {
            transform: scaleX(-1);
        }

        /* Kursor Ujung Laser */
        #cursor {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: rgba(0, 255, 255, 0.9);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 20px cyan;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
            display: none; /* Sembunyi kalau tangan nggak buka */
            transition: width 0.1s, height 0.1s, background-color 0.1s;
        }

        .pinching {
            background-color: rgba(255, 50, 50, 0.9) !important;
            box-shadow: 0 0 30px red !important;
            width: 15px !important;
            height: 15px !important;
        }

        /* Glassmorphism Base */
        .glass-ui {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
            color: white;
        }

        /* Tombol Kontrol Atas (Kamera & Fullscreen) */
        #top-controls {
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            padding: 10px 20px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .control-btn.hovered {
            background: rgba(255, 255, 255, 0.8);
            color: black;
            transform: scale(1.1);
        }

        /* Dock Aplikasi (Bawah Tengah) */
        #app-dock {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            display: flex;
            gap: 30px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .app-icon.hovered {
            background: rgba(255, 255, 255, 0.6) !important;
            border: 2px solid cyan;
            transform: scale(1.2);
            box-shadow: 0 0 20px cyan;
        }

        /* Jendela Aplikasi Melayang */
        #app-window {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 60vh;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .window-header {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }

        .close-btn {
            background: #ff4757;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        .close-btn.hovered {
            transform: scale(1.3);
            background: #ff6b81;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Loading UI */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="loading">Menghidupkan Kamera & AI...<br><small>Pastikan izin kamera diberikan</small></div>

    <video id="videoElement" class="mirror" autoplay playsinline></video>
    <canvas id="canvasElement" class="canvas-mirror"></canvas>

    <div id="cursor"></div>

    <div id="top-controls" class="glass-ui">
        <div class="control-btn interactive" id="btn-camera">📸 Ganti Kamera</div>
        <div class="control-btn interactive" id="btn-fullscreen">🖥️ Full Screen</div>
    </div>

    <div id="app-dock" class="glass-ui">
        <div class="app-icon interactive" id="btn-youtube" style="color: #ff0000;">▶️</div>
        <div class="app-icon interactive" id="btn-chrome" style="color: #4285F4;">🌐</div>
    </div>

    <div id="app-window" class="glass-ui">
        <div class="window-header">
            <span id="window-title">Browser</span>
            <div class="close-btn interactive" id="close-app">✖</div>
        </div>
        <iframe id="browser-frame" src=""></iframe>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('cursor');
        const loading = document.getElementById('loading');
        
        const appWindow = document.getElementById('app-window');
        const browserFrame = document.getElementById('browser-frame');
        const windowTitle = document.getElementById('window-title');

        let isFrontCamera = true;
        let stream = null;
        let isPinching = false;
        let lastPinchTime = 0;
        let hoveredElement = null;

        // --- SISTEM KAMERA MANUAL ---
        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: {
                    facingMode: isFrontCamera ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                // Atur efek cermin (Mirror)
                if (isFrontCamera) {
                    videoElement.classList.add('mirror');
                    canvasElement.classList.add('canvas-mirror');
                } else {
                    videoElement.classList.remove('mirror');
                    canvasElement.classList.remove('canvas-mirror');
                }
            } catch (err) {
                alert("Error akses kamera: " + err.message);
            }
        }

        // --- SETUP MEDIAPIPE AI ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        // Loop untuk mengirim frame ke AI
        async function detectFrame() {
            if (videoElement.readyState >= 2) {
                await hands.send({ image: videoElement });
            }
            requestAnimationFrame(detectFrame);
        }

        // Inisiasi awal
        videoElement.addEventListener('loadeddata', () => {
            loading.style.display = 'none';
            detectFrame();
        });
        startCamera();


        // --- LOGIKA UTAMA: TANGAN, LASER, & KLIK ---
        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Hitung jari yang terbuka
                let openFingers = 0;
                if (landmarks[8].y < landmarks[6].y) openFingers++;  // Telunjuk
                if (landmarks[12].y < landmarks[10].y) openFingers++; // Tengah
                if (landmarks[16].y < landmarks[14].y) openFingers++; // Manis
                if (landmarks[20].y < landmarks[18].y) openFingers++; // Kelingking
                // Jempol (agak tricky, kita asumsikan 4 jari lain cukup untuk menandakan tangan "terbuka")

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const wrist = landmarks[0];

                // Posisi Kursor di Layar (Hitung efek cermin kamera depan)
                let screenX = indexTip.x * window.innerWidth;
                if (isFrontCamera) screenX = (1 - indexTip.x) * window.innerWidth;
                let screenY = indexTip.y * window.innerHeight;

                // Cek Jarak Cubitan (Pinch)
                const pinchDistance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const isCurrentlyPinching = pinchDistance < 0.05;

                // LOGIKA 1: Jika 5 (atau minimal 4) jari terbuka -> Muncul Laser & Kursor
                if (openFingers >= 3 || isCurrentlyPinching) { 
                    cursor.style.display = 'block';
                    cursor.style.left = `${screenX}px`;
                    cursor.style.top = `${screenY}px`;

                    // Gambar Tulang & Garis Laser di Canvas
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 0, 0.5)', lineWidth: 2});
                    
                    if (!isCurrentlyPinching) {
                        // Gambar Garis Laser dari pergelangan tangan ke ujung telunjuk
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(wrist.x * canvasElement.width, wrist.y * canvasElement.height);
                        canvasCtx.lineTo(indexTip.x * canvasElement.width, indexTip.y * canvasElement.height);
                        canvasCtx.strokeStyle = "rgba(0, 255, 255, 0.8)";
                        canvasCtx.lineWidth = 4;
                        canvasCtx.stroke();
                    }

                    checkHover(screenX, screenY);
                } else {
                    cursor.style.display = 'none';
                    if (hoveredElement) hoveredElement.classList.remove('hovered');
                    hoveredElement = null;
                }

                // LOGIKA 2: Jika Dicubit -> Klik!
                if (isCurrentlyPinching) {
                    if (!isPinching) {
                        isPinching = true;
                        cursor.classList.add('pinching');
                        triggerClick();
                    }
                } else {
                    isPinching = false;
                    cursor.classList.remove('pinching');
                }
            } else {
                cursor.style.display = 'none';
                if (hoveredElement) hoveredElement.classList.remove('hovered');
            }
            canvasCtx.restore();
        }

        // --- SISTEM HOVER & KLIK ---
        function checkHover(x, y) {
            if (hoveredElement) hoveredElement.classList.remove('hovered');
            cursor.style.display = 'none'; // Sembunyikan kursor sedetik biar script bisa lihat elemen di bawahnya
            const element = document.elementFromPoint(x, y);
            cursor.style.display = 'block';

            if (element && element.classList.contains('interactive')) {
                hoveredElement = element;
                hoveredElement.classList.add('hovered');
            } else {
                hoveredElement = null;
            }
        }

        function triggerClick() {
            const now = Date.now();
            if (now - lastPinchTime < 700) return; // Anti-spam klik (jeda 0.7 detik)
            lastPinchTime = now;

            if (hoveredElement) {
                const actionId = hoveredElement.id;

                if (actionId === 'btn-youtube') {
                    appWindow.style.display = 'flex';
                    windowTitle.innerText = "YouTube";
                    browserFrame.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
                } 
                else if (actionId === 'btn-chrome') {
                    appWindow.style.display = 'flex';
                    windowTitle.innerText = "Browser Mode";
                    browserFrame.src = "https://id.wikipedia.org/"; // Wiki sebagai pengganti Chrome yg blokir iframe
                }
                else if (actionId === 'close-app') {
                    appWindow.style.display = 'none';
                    browserFrame.src = "";
                }
                else if (actionId === 'btn-camera') {
                    isFrontCamera = !isFrontCamera;
                    startCamera();
                }
                else if (actionId === 'btn-fullscreen') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            alert("Error Fullscreen: " + err.message);
                        });
                    } else {
                        document.exitFullscreen();
                    }
                }
            }
        }
    </script>
</body>
</html>
