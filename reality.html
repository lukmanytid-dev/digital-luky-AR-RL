<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Spatial Computing</title>
    
    <!-- Load MediaPipe untuk Deteksi Tangan -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Kamera Background Fullscreen */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); /* Efek Cermin agar tangan tidak terbalik */
            z-index: 1;
        }

        /* Canvas untuk menggambar titik tangan & garis */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        /* Pointer Garis/Kursor */
        #cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 15px cyan;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.1s;
        }
        
        .pinching {
            background-color: rgba(255, 0, 0, 0.8) !important;
            box-shadow: 0 0 20px red !important;
            transform: translate(-50%, -50%) scale(0.7) !important;
        }

        /* UI Melayang bergaya Glassmorphism */
        .glass-ui {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
            display: flex;
            color: white;
        }

        /* Dock Aplikasi */
        #app-dock {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            gap: 20px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        /* State saat kursor tangan berada di atas tombol */
        .hovered {
            background: rgba(255, 255, 255, 0.5) !important;
            border: 1px solid white;
            transform: scale(1.1);
        }

        /* Window Aplikasi Melayang (YouTube/Chrome) */
        #app-window {
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 450px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .window-header {
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .close-btn {
            background: red;
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Keyboard Melayang */
        #keyboard {
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .key-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .key {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        #search-bar {
            width: 100%;
            height: 40px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">Memuat Kamera & AI Deteksi Tangan...</div>

    <!-- Tampilan Kamera & AI -->
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>

    <!-- Kursor Tangan (Pointer) -->
    <div id="cursor"></div>

    <!-- Window Browser / YouTube Melayang -->
    <div id="app-window" class="glass-ui">
        <div class="window-header">
            <span id="window-title">Browser</span>
            <div class="close-btn app-icon" id="close-app"></div>
        </div>
        <iframe id="browser-frame" src=""></iframe>
    </div>

    <!-- Keyboard Melayang -->
    <div id="keyboard" class="glass-ui">
        <input type="text" id="search-bar" placeholder="Ketik di sini..." readonly>
        <div class="key-row">
            <div class="key app-icon">Q</div>
            <div class="key app-icon">W</div>
            <div class="key app-icon">E</div>
            <div class="key app-icon">R</div>
            <div class="key app-icon">T</div>
            <div class="key app-icon">Y</div>
        </div>
        <div class="key-row">
            <div class="key app-icon">A</div>
            <div class="key app-icon">S</div>
            <div class="key app-icon">D</div>
            <div class="key app-icon">F</div>
            <div class="key app-icon">G</div>
        </div>
        <div class="key-row">
            <div class="key app-icon" style="width: 200px;">SPACE</div>
            <div class="key app-icon" style="background: rgba(0, 255, 0, 0.3);">GO</div>
        </div>
    </div>

    <!-- Dock Aplikasi di Bawah -->
    <div id="app-dock" class="glass-ui">
        <div class="app-icon" id="btn-youtube" style="color: #ff0000;">▶</div>
        <div class="app-icon" id="btn-chrome" style="color: #00ff00;">🌐</div>
        <div class="app-icon" id="btn-keyboard">⌨️</div>
    </div>

    <script>
        // Elemen-elemen DOM
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('cursor');
        const loading = document.getElementById('loading');
        const appWindow = document.getElementById('app-window');
        const keyboard = document.getElementById('keyboard');
        const browserFrame = document.getElementById('browser-frame');
        const windowTitle = document.getElementById('window-title');
        const searchBar = document.getElementById('search-bar');

        let isPinching = false;
        let lastPinchTime = 0;
        let hoveredElement = null;

        // --- SETUP MEDIAPIPE HANDS ---
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // --- MULAI KAMERA ---
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start().then(() => {
            loading.style.display = 'none';
        });

        // --- LOGIKA DETEKSI TANGAN & GESTUR ---
        function onResults(results) {
            // Sesuaikan ukuran canvas
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Jika tangan terdeteksi
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Gambar kerangka tangan (sebagai penanda visual di layar/canvas)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

                // Titik telunjuk (8) dan jempol (4)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Hitung koordinat kursor di layar (dibalik karena kamera mirror)
                const screenX = (1 - indexTip.x) * window.innerWidth;
                const screenY = indexTip.y * window.innerHeight;

                // Gerakkan Kursor HTML
                cursor.style.left = `${screenX}px`;
                cursor.style.top = `${screenY}px`;

                // Cek Jarak antara Telunjuk dan Jempol (Gesture Cubit / Tutup)
                const distance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const pinchThreshold = 0.05; // Makin kecil, makin rapat cubitannya

                // Logika Hover UI
                checkHover(screenX, screenY);

                if (distance < pinchThreshold) {
                    if (!isPinching) {
                        isPinching = true;
                        cursor.classList.add('pinching');
                        triggerClick(); // Eksekusi klik saat cubit
                    }
                } else {
                    isPinching = false;
                    cursor.classList.remove('pinching');
                }
            }
            canvasCtx.restore();
        }

        // --- SISTEM KLIK & HOVER VIRTUAL ---
        function checkHover(x, y) {
            // Hilangkan status hover sebelumnya
            if (hoveredElement) {
                hoveredElement.classList.remove('hovered');
            }

            // Sembunyikan kursor sementara agar tidak menghalangi deteksi elemen di bawahnya
            cursor.style.display = 'none';
            const element = document.elementFromPoint(x, y);
            cursor.style.display = 'block';

            if (element && element.classList.contains('app-icon')) {
                hoveredElement = element;
                hoveredElement.classList.add('hovered');
            } else {
                hoveredElement = null;
            }
        }

        function triggerClick() {
            // Hindari double click cepat (cooldown 500ms)
            const now = Date.now();
            if (now - lastPinchTime < 500) return; 
            lastPinchTime = now;

            if (hoveredElement) {
                const actionId = hoveredElement.id;
                const text = hoveredElement.innerText;

                // Logika Menu
                if (actionId === 'btn-youtube') {
                    appWindow.style.display = 'flex';
                    windowTitle.innerText = "YouTube";
                    // Menggunakan embed youtube agar tidak diblokir CORS
                    browserFrame.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
                } 
                else if (actionId === 'btn-chrome') {
                    appWindow.style.display = 'flex';
                    windowTitle.innerText = "Chrome Browser";
                    // Wikipedia bisa di-iframe sebagai contoh browser
                    browserFrame.src = "https://id.wikipedia.org/"; 
                }
                else if (actionId === 'btn-keyboard') {
                    keyboard.style.display = keyboard.style.display === 'flex' ? 'none' : 'flex';
                }
                else if (actionId === 'close-app') {
                    appWindow.style.display = 'none';
                    browserFrame.src = ""; // Hentikan video/audio
                }
                // Logika Mengetik Keyboard
                else if (text === 'SPACE') {
                    searchBar.value += ' ';
                }
                else if (text === 'GO') {
                    alert("Mencari: " + searchBar.value);
                    searchBar.value = ''; // Reset
                }
                else if (text.length === 1) { // Jika tombol huruf
                    searchBar.value += text;
                }
            }
        }
    </script>
</body>
</html>
